name: Greater Manchester speed limit and camera acceptance

# Builds speed limits and cameras for the Geofabrik Greater Manchester extract exactly as the
# map-data.yml steps do (OpenStreetMap only: no Mapillary, no secrets) and checks fixed
# checkpoints whose expected values are explicit OSM tags. Fails only on a MISMATCH.
# Detection only: nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [codex/architecture-foundation]
    paths:
      - scripts/limit_acceptance.py
      - tests/test_limit_acceptance.py
      - docs/validation/manchester-limits-checkpoints.json
      - .github/workflows/manchester-limits.yml

permissions:
  contents: read

# Shares the map-data group so it never overlaps the expensive map builds.
concurrency:
  group: map-data
  cancel-in-progress: false

env:
  SOURCE_URL: https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-latest.osm.pbf

jobs:
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool jq > /dev/null
          mkdir -p work out

      - name: OpenStreetMap base (Geofabrik, Greater Manchester)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o work/base.osm.pbf "$SOURCE_URL"
          sha256sum work/base.osm.pbf | cut -d' ' -f1 > work/source.sha256
          date -u +%FT%TZ > work/source-retrieved.txt
          osmium fileinfo -e -j work/base.osm.pbf | jq '{timestamp: .header.option.osmosis_replication_timestamp, data: .data.count}' > work/source-info.json || true
          {
            echo "### Source"
            echo "- URL: $SOURCE_URL"
            echo "- SHA-256: \`$(cat work/source.sha256)\`"
            echo "- Retrieved: $(cat work/source-retrieved.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: python3 -m unittest tests.test_limit_acceptance -v

      - name: Build limits and cameras (same commands as map-data.yml, OSM only)
        run: |
          set -euo pipefail
          osmium tags-filter work/base.osm.pbf n/highway=speed_camera n/railway=level_crossing r/type=enforcement \
            -o work/cameras.osm.pbf --overwrite
          osmium cat work/cameras.osm.pbf -f opl,add_metadata=false -o work/cameras.opl --overwrite
          python3 scripts/cameras.py work/cameras.opl out/cameras-uk.json
          python3 scripts/limits.py --selftest
          osmium tags-filter work/base.osm.pbf w/maxspeed -o work/maxspeed.osm.pbf --overwrite
          osmium export work/maxspeed.osm.pbf -f geojsonseq -o work/maxspeed.geojsonseq --overwrite --geometry-types=linestring -u type_id
          osmium tags-filter work/base.osm.pbf w/highway=motorway -o work/motorways.osm.pbf --overwrite
          osmium export work/motorways.osm.pbf -f geojsonseq -o work/motorways.geojsonseq --overwrite --geometry-types=linestring -u type_id
          # No --roads and no signs cache: Mapillary is never used here.
          python3 scripts/limits.py work/maxspeed.geojsonseq out/limits work/motorways.geojsonseq out/limit-checks.md

      - name: Check checkpoints
        run: |
          python3 scripts/limit_acceptance.py --limits-dir out/limits --cameras out/cameras-uk.json \
            --checkpoints docs/validation/manchester-limits-checkpoints.json \
            --report work/limit-acceptance.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manchester-limits-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/limit-acceptance.json
            work/source.sha256
            work/source-retrieved.txt
            work/source-info.json
            out/limit-checks.md
