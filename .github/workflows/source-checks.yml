name: Data source and publication regressions

on:
  push:
    branches: [codex/architecture-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drivemate-data-source-validation
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install generator test dependencies
        run: python3 -m pip install shapely==2.2.0 pyproj==3.8.0 PyYAML==6.0.3
      - name: Run canonical data preflight
        run: python3 scripts/unified_preflight.py --repo . --base-sha HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: data-preflight
          path: build/reports/unified-preflight.json
          if-no-files-found: error
