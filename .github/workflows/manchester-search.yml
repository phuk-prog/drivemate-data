name: Manchester search check

# Builds the offline search file from OS Open Names (same download as map-data.yml) and checks
# that real Greater Manchester places are found where they should be. Nothing is published.
on:
  schedule:
    - cron: "57 22 * * 0" # Sunday evening (UTC), checked before the Monday build publishes
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/manchester-search.yml"
      - "scripts/search_acceptance.py"
      - "docs/validation/manchester-search-queries.json"
      - "tests/test_search_acceptance.py"

permissions:
  contents: read

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python3 -m pip install pyproj==3.8.0
      - name: Unit tests
        run: python3 -m unittest tests.test_search_acceptance
      - name: Download OS Open Names
        run: |
          mkdir -p work/osnames out
          url=$(curl -sSf "https://api.os.uk/downloads/v1/products/OpenNames/downloads?area=GB&format=CSV" | jq -r '.[0].url')
          curl -sSfL -o work/opennames.zip "$url"
          unzip -q -o work/opennames.zip -d work/osnames
          test -n "$(find work/osnames -name '*.csv' 2>/dev/null | head -n 1)"
      - name: Build the search file
        run: python3 scripts/search_offline.py work/osnames out/search-offline-uk.tsv.gz > out/search-offline-stats.json
      - name: Run the Manchester queries
        run: |
          set +e
          python3 scripts/search_acceptance.py out/search-offline-uk.tsv.gz docs/validation/manchester-search-queries.json \
            --out out/manchester-search-report.json --summary out/summary.md
          echo $? > out/exit-code
          { echo "## Manchester offline search"; cat out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manchester-search-report
          path: |
            out/manchester-search-report.json
            out/summary.md
      - name: Fail on unexpected FAIL
        run: test "$(cat out/exit-code)" = 0
