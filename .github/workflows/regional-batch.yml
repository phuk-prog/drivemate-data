name: DriveMate verify next UK map region (unpublished)

on:
  push:
    branches: [codex/architecture-foundation]
    paths:
      - docs/regional-batch-request.json
  workflow_dispatch:

permissions:
  contents: write

# One expensive map run across UK pipeline, Manchester pilot, and regional jobs.
concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  batch:
    if: github.ref == 'refs/heads/codex/architecture-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 8ec2a5cd5e4373a5d75243c1aa46ccb40adb3a8dd9b821f06a3b2c765f9cf069
      EXPECTED_BYTES: '1638441575'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require deliberate and singular regional batch request
        id: permission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          req=json.loads(Path('docs/regional-batch-request.json').read_text())
          assert req['schema']==1 and isinstance(req['sequence'],int)
          print('Batch enabled:', req.get('enabled') is True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f"sequence={req['sequence']}\n")
              output.write(f"enabled={str(req.get('enabled') is True).lower()}\n")
          PY
      - name: Preflight and dependencies
        if: steps.permission.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install -q pmtiles==3.4.1 mapbox-vector-tile==2.2.0
          python3 -m unittest discover -s tests -p test_region_batch_queue.py -v
          python3 -m unittest discover -s tests -p test_region_pmtiles.py -v
          mkdir -p work/source work/queue
          df -h /
      - name: Download existing verified UK PMTiles source
        if: steps.permission.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          gh release download map-data-uk --repo "${{ github.repository }}" \
            --pattern drivemate.pmtiles --dir work/source
          test "$(stat -c %s work/source/drivemate.pmtiles)" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA  work/source/drivemate.pmtiles" | sha256sum --check --strict
      - name: Plan the UK partition once
        if: steps.permission.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 scripts/region_pmtiles.py --source work/source/drivemate.pmtiles \
            --output work/all-plan --plan-only
      - name: Verify and checkpoint regions one at a time within the approved budget
        if: steps.permission.outputs.enabled == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Leave time for evidence upload before the job timeout; never start
          # a region that might be cut off half way.
          START_DEADLINE_SECONDS: '16200'
        run: |
          set -euo pipefail
          git config user.name "DriveMate map verification"
          git config user.email "actions@users.noreply.github.com"
          started=$(date +%s)
          budget=$(python3 scripts/region_batch_queue.py budget \
            --ledger docs/regional-batch-ledger.json --request docs/regional-batch-request.json)
          echo "This approved request may commit $budget more region(s)"
          mkdir -p work/evidence
          for n in $(seq 1 "$budget"); do
            if [ $(( $(date +%s) - started )) -ge "$START_DEADLINE_SECONDS" ]; then
              echo "Time budget reached; re-run this workflow to resume under the same request"
              break
            fi
            python3 scripts/region_batch_queue.py next \
              --plan work/all-plan/regional-plan.json \
              --ledger docs/regional-batch-ledger.json \
              --request docs/regional-batch-request.json \
              --output "work/queue/selection-$n.json"
            status=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "work/queue/selection-$n.json")
            if [ "$status" != selected ]; then
              echo "No unverified regions remain ($status)"
              break
            fi
            root=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["root"])' "work/queue/selection-$n.json")
            out="work/region-$n"
            echo "::group::Region $root"
            python3 scripts/region_pmtiles.py --source work/source/drivemate.pmtiles \
              --output "$out" --pilot "$root"
            for archive in "$out"/*.pmtiles; do
              name="$(basename "$archive" .pmtiles)"
              python3 scripts/verify_pmtiles.py "$archive" "work/evidence/${n}-${name}.json"
            done
            cp "$out/regional-manifest.json" "work/evidence/${n}-regional-manifest.json"
            python3 scripts/region_batch_queue.py complete \
              --selection "work/queue/selection-$n.json" \
              --manifest "$out/regional-manifest.json" \
              --ledger docs/regional-batch-ledger.json \
              --run-url "$RUN_URL" \
              --output work/queue/updated-ledger.json
            cp work/queue/updated-ledger.json docs/regional-batch-ledger.json
            git add docs/regional-batch-ledger.json
            git commit -m "Record validated UK regional root $root"
            # Checkpoint immediately so an interrupted run resumes after this
            # region. Never force; rebase only onto newer unrelated commits.
            pushed=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:codex/architecture-foundation; then pushed=true; break; fi
              sleep $(( 2 ** attempt ))
              git pull --rebase origin codex/architecture-foundation
            done
            $pushed || { echo "Could not checkpoint $root"; exit 1; }
            # Map payloads are never uploaded; free the disk for the next region.
            rm -rf "$out"
            echo "::endgroup::"
          done
      - name: Retain lightweight evidence, not large map payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uk-regional-batch-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/queue/*.json
            work/evidence/*.json
