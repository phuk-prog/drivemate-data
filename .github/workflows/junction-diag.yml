name: Junction lane diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query open KartaView street imagery around exact junction
        run: |
          curl -fsSL --max-time 30 -X POST 'https://api.openstreetcam.org/1.0/list/nearby-photos/'             -d 'lat=53.376408' -d 'lng=-2.1940477' -d 'radius=300' -d 'ipp=50' -d 'page=1'             -o /tmp/kv.json
          python3 - <<'PY'
          import json, math
          d=json.load(open('/tmp/kv.json'))
          print('STATUS', d.get('status'))
          # Different API versions wrap the list differently.
          candidates=[]
          def walk(x):
              if isinstance(x,dict):
                  if {'lat','lng','id'} <= set(x) and ('name' in x or 'lth_name' in x or 'th_name' in x):
                      candidates.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          seen=set()
          print('PHOTOS',len(candidates))
          for p in candidates:
              pid=str(p.get('id'))
              if pid in seen: continue
              seen.add(pid)
              print(json.dumps({
                'id':p.get('id'),'sequence_id':p.get('sequence_id'),'lat':p.get('lat'),'lng':p.get('lng'),
                'heading':p.get('heading'),'date_added':p.get('date_added'),
                'name':p.get('name'),'lth_name':p.get('lth_name'),'th_name':p.get('th_name'),
                'way_id':p.get('way_id')
              },sort_keys=True))
              if len(seen)>=20: break
          PY
